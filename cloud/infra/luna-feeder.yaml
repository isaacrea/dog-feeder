AWSTemplateFormatVersion: '2010-09-09'
Description: Luna Feeder - ingest and read API, feeding log table, and stream-driven notifications

Parameters:

  StageName:
    Type: String
    Default: prod
    AllowedPattern: '[a-zA-Z0-9_-]+'
    Description: API Gateway stage name. Appears as a path segment in the invoke URL.

  ThrottleRateLimit:
    Type: Number
    Default: 5
    Description: Steady-state request rate ceiling, requests per second.

  ThrottleBurstLimit:
    Type: Number
    Default: 10
    Description: Burst capacity, requests. Must be >= ThrottleRateLimit.

  QuotaLimit:
    Type: Number
    Default: 500
    Description: Maximum requests per quota period.

  # The dashboard gets its own key and usage plan so the device key stays on
  # the device, with a tighter ceiling than the device's.
  DashboardThrottleRateLimit:
    Type: Number
    Default: 1
    Description: Dashboard key steady-state request rate ceiling, requests per second.

  DashboardThrottleBurstLimit:
    Type: Number
    Default: 5
    Description: Dashboard key burst capacity, requests. Must be >= DashboardThrottleRateLimit.

  DashboardQuotaLimit:
    Type: Number
    Default: 500
    Description: Maximum dashboard key requests per day.

  # Browsers compare the origin exactly, so a trailing slash or path never
  # matches. The pattern also keeps quotes out of the static header mappings
  # built from this value.
  CorsAllowOrigin:
    Type: String
    Default: '*'
    AllowedPattern: '^(\*|https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?)$'
    ConstraintDescription: Must be * or one origin such as https://example.com, with no trailing slash or path.
    Description: Access-Control-Allow-Origin for the read API. '*' suits local development; set the dashboard's hosted origin once it exists.

  # Each non-empty address gets its own SNS subscription and must complete a
  # one-time confirmation click before receiving anything. Email 1 is
  # required; 2-5 are optional. The optional pattern's ^$ alternative permits
  # the empty-string default, which the strict pattern would reject.
  NotificationEmail1:
    Type: String
    AllowedPattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
    ConstraintDescription: Must be a valid email address.
    Description: Primary address for feeding notifications. Required.

  NotificationEmail2:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^\s@]+@[^\s@]+\.[^\s@]+$'
    ConstraintDescription: Must be a valid email address or empty.
    Description: Additional notification address. Optional.

  NotificationEmail3:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^\s@]+@[^\s@]+\.[^\s@]+$'
    ConstraintDescription: Must be a valid email address or empty.
    Description: Additional notification address. Optional.

  NotificationEmail4:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^\s@]+@[^\s@]+\.[^\s@]+$'
    ConstraintDescription: Must be a valid email address or empty.
    Description: Additional notification address. Optional.

  NotificationEmail5:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^\s@]+@[^\s@]+\.[^\s@]+$'
    ConstraintDescription: Must be a valid email address or empty.
    Description: Additional notification address. Optional.

  # Voltage thresholds for battery alerts. Tune after calibrating the device
  # ADC. Keep crit below warn; this is not validated by the template.
  BatteryWarnVolts:
    Type: Number
    Default: 3.60
    MinValue: 3.0
    MaxValue: 4.2
    Description: At or below this voltage, emails note the battery is low.

  BatteryCritVolts:
    Type: Number
    Default: 3.45
    MinValue: 3.0
    MaxValue: 4.2
    Description: At or below this voltage, emails flag the battery as critical.

# Evaluated from parameter values before any resource is created. A resource
# gated by a false condition is absent from the processed template.
Conditions:
  HasEmail2: !Not [!Equals [!Ref NotificationEmail2, '']]
  HasEmail3: !Not [!Equals [!Ref NotificationEmail3, '']]
  HasEmail4: !Not [!Equals [!Ref NotificationEmail4, '']]
  HasEmail5: !Not [!Equals [!Ref NotificationEmail5, '']]

Resources:

  # --- Data store -----------------------------------------------------------

  # TableName is fixed; changing it forces table replacement.
  # AttributeDefinitions declares key attributes only; items are otherwise
  # schemaless.
  FeedingLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DogFeedingLogs_IAC
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # NEW_IMAGE: the notifier reads item attributes from stream records.
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  # --- Ingest ---------------------------------------------------------------

  # Declared so retention is bounded and the group is removed with the stack.
  IngestFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/luna-feeder-ingest-iac
      RetentionInDays: 14

  # No RoleName: IAM names are account-global, and a fixed name collides when
  # the template is deployed to a second region. Roles are referenced by ARN.
  IngestFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        # Write-only: PutItem on the one table. Conditional writes need no
        # read permission.
        - PolicyName: WriteFeedingLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt FeedingLogsTable.Arn
        # Log writes scoped to this function's group; no CreateLogGroup.
        - PolicyName: WriteOwnLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/luna-feeder-ingest-iac:*'

  # Inline code deploys as index.js and runs as CommonJS.
  # Source of truth: cloud/lambda/storeDogFeedingLog.js. Edit there, copy here.
  IngestFunction:
    Type: AWS::Lambda::Function
    # Without this, Lambda auto-creates an unmanaged log group on first invoke.
    DependsOn: IngestFunctionLogGroup
    Properties:
      FunctionName: luna-feeder-ingest-iac
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt IngestFunctionRole.Arn
      # Covers cold start plus SDK client construction.
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref FeedingLogsTable
      Code:
        ZipFile: |
          // Ingest for the Luna Feeder: validates the device payload and
          // writes one feeding record.

          const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
          const { DynamoDBDocumentClient, PutCommand } = require('@aws-sdk/lib-dynamodb');

          const ddb = DynamoDBDocumentClient.from(new DynamoDBClient({}));
          const TABLE = process.env.TABLE_NAME;

          exports.handler = async (event) => {
            try {
              const body = typeof event.body === 'string' ? JSON.parse(event.body) : event.body;

              if (!body || !body.person || !body.timestamp) {
                return resp(400, { message: 'Missing required fields: person, timestamp.' });
              }

              const id = body.eventId
                ? String(body.eventId)
                : new Date().toISOString() + '_' + Math.random().toString(36).slice(2);

              const receivedMs = Date.now();
              const ageSec = Number.isFinite(body.ageSec) ? body.ageSec : null;
              const timestamp = ageSec != null
                ? new Date(receivedMs - ageSec * 1000).toISOString()
                : body.timestamp;

              const item = {
                id,                                            // partition key (table is keyed on `id`)
                person:          body.person,
                timestamp,                                     // authoritative: server-anchored when possible
                deviceTimestamp: body.timestamp,               // what the device's clock claimed (audit)
                timeSource:      ageSec != null ? 'server-anchored' : 'device',
                meal:            body.meal ?? null,            // "breakfast" | "dinner" | "extra"
                override:        body.override ?? false,
                timeConfidence:  body.timeConfidence ?? null,  // "synced" | "drifting" | "unknown"
                batteryVoltage:  body.batteryVoltage ?? null,
                receivedAt:      new Date(receivedMs).toISOString(),  // server clock, for auditing skew
              };

              await ddb.send(new PutCommand({
                TableName: TABLE,
                Item: item,
                ConditionExpression: 'attribute_not_exists(id)', // first write wins
              }));

              return resp(200, { message: 'Stored.', id });
            } catch (err) {
              if (err.name === 'ConditionalCheckFailedException') {
                return resp(200, { message: 'Already stored (idempotent no-op).' });
              }
              console.error('Error:', err);
              return resp(500, { message: 'Error storing feeding log.', error: err.message });
            }
          };

          const resp = (statusCode, obj) => ({
            statusCode,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(obj),
          });

  # --- Read -----------------------------------------------------------------

  ReadFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/luna-feeder-read-iac
      RetentionInDays: 14

  # Separate from the write-only ingest role. The table is keyed on `id`
  # alone, with no sort key to Query a time range by, so reads Scan; at this
  # volume a full Scan is a few read units.
  ReadFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        # Read-only: Scan on the one table. No GetItem or Query; nothing
        # uses them.
        - PolicyName: ReadFeedingLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt FeedingLogsTable.Arn
        - PolicyName: WriteOwnLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/luna-feeder-read-iac:*'

  # Inline code deploys as index.js and runs as CommonJS.
  # Source of truth: cloud/lambda/readFeedingLogs.js. Edit there, copy here.
  # cloud/lambda/test/readFeedingLogs.test.js fails if the two drift.
  ReadFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReadFunctionLogGroup
    Properties:
      FunctionName: luna-feeder-read-iac
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt ReadFunctionRole.Arn
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref FeedingLogsTable
          DISPLAY_TIMEZONE: America/Chicago
          CORS_ALLOW_ORIGIN: !Ref CorsAllowOrigin
      Code:
        ZipFile: |
          // Read API for the Luna Feeder: returns the feeding records from the last
          // N Central-time calendar days, for the dashboard.

          const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
          const { DynamoDBDocumentClient, ScanCommand } = require('@aws-sdk/lib-dynamodb');

          const ddb = DynamoDBDocumentClient.from(new DynamoDBClient({}));
          const TABLE = process.env.TABLE_NAME;
          const TZ = process.env.DISPLAY_TIMEZONE || 'America/Chicago';
          const ALLOW_ORIGIN = process.env.CORS_ALLOW_ORIGIN || '*';

          const ALLOWED_DAYS = [7, 30, 90];
          const DEFAULT_DAYS = 30;

          // Attributes returned to clients. deviceTimestamp and receivedAt are audit
          // fields and stay in the table.
          const FIELDS = ['id', 'person', 'meal', 'timestamp', 'override',
                          'batteryVoltage', 'timeConfidence', 'timeSource'];

          // Wall-clock parts of an instant in TZ. The IANA zone name keeps DST
          // correct; h23 avoids "24" for midnight.
          const wallClock = new Intl.DateTimeFormat('en-US', {
            timeZone: TZ, hourCycle: 'h23',
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit',
          });

          const zonedParts = (ms) => {
            const p = {};
            for (const { type, value } of wallClock.formatToParts(ms)) p[type] = value;
            return p;
          };

          // TZ's offset from UTC at an instant, in ms (negative in the Americas).
          const offsetMs = (ms) => {
            const p = zonedParts(ms);
            const wall = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
            return wall - Math.floor(ms / 1000) * 1000;
          };

          // The instant a local calendar date begins. Two passes because the offset
          // at the first guess can differ across a DST change. US changes happen at
          // 2 AM, so local midnight always exists exactly once.
          const localMidnight = (y, m, d) => {
            const wall = Date.UTC(y, m - 1, d);
            const guess = wall - offsetMs(wall);
            return wall - offsetMs(guess);
          };

          // Start of the window: local midnight (days - 1) calendar days before today,
          // so days=7 is today plus the six days before it. Stepping calendar days
          // rather than days * 24 h keeps a week spanning a DST change correct.
          const windowStart = (nowMs, days) => {
            const p = zonedParts(nowMs);
            const d = new Date(Date.UTC(+p.year, +p.month - 1, +p.day - (days - 1)));
            return localMidnight(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
          };

          const parseDays = (raw) => {
            if (raw == null || raw === '') return DEFAULT_DAYS;
            const n = Number(raw);
            return ALLOWED_DAYS.includes(n) ? n : null;
          };

          // localDate is the Central calendar day the feeding belongs to. Grouping by
          // the UTC date instead would move most dinners to the next day.
          const toRecord = (item, ms) => {
            const p = zonedParts(ms);
            return {
              id:             item.id,
              person:         item.person ?? null,
              meal:           item.meal ?? null,
              timestamp:      item.timestamp,
              localDate:      p.year + '-' + p.month + '-' + p.day,
              localTime:      p.hour + ':' + p.minute,
              override:       item.override === true,
              batteryVoltage: Number.isFinite(item.batteryVoltage) ? item.batteryVoltage : null,
              timeConfidence: item.timeConfidence ?? null,
              timeSource:     item.timeSource ?? null,
            };
          };

          // Items with an unparseable timestamp are counted, not placed. The window
          // has no upper bound: a device clock running slightly fast must not hide a
          // feeding that just happened.
          const build = (items, days, nowMs) => {
            const fromMs = windowStart(nowMs, days);
            const inRange = [];
            let latest = null;
            let unparseable = 0;
            for (const item of items) {
              const ms = Date.parse(item.timestamp);
              if (!Number.isFinite(ms)) { unparseable++; continue; }
              if (!latest || ms > latest.ms) latest = { item, ms };
              if (ms >= fromMs) inRange.push({ item, ms });
            }
            inRange.sort((a, b) => a.ms - b.ms);
            return {
              timezone:    TZ,
              days,
              from:        new Date(fromMs).toISOString(),
              generatedAt: new Date(nowMs).toISOString(),
              count:       inRange.length,
              unparseable,
              // Most recent record overall, even outside the window, so a silent
              // device still shows when it last reported.
              latest:      latest ? toRecord(latest.item, latest.ms) : null,
              items:       inRange.map((r) => toRecord(r.item, r.ms)),
            };
          };

          // Scan reads every item; the table has no sort key to Query by time. Each
          // page stops at 1 MB, so follow LastEvaluatedKey or results go missing once
          // the table outgrows one page. The projection trims the payload, not the
          // read units consumed.
          const scanAll = async () => {
            const names = {};
            FIELDS.forEach((f, i) => { names['#f' + i] = f; });
            const items = [];
            let startKey;
            do {
              const page = await ddb.send(new ScanCommand({
                TableName: TABLE,
                ProjectionExpression: Object.keys(names).join(', '),
                ExpressionAttributeNames: names,
                ExclusiveStartKey: startKey,
              }));
              items.push(...(page.Items ?? []));
              startKey = page.LastEvaluatedKey;
            } while (startKey);
            return items;
          };

          exports.handler = async (event, context) => {
            const days = parseDays(event?.queryStringParameters?.days);
            if (days == null) {
              return resp(400, { message: 'days must be one of ' + ALLOWED_DAYS.join(', ') + '.' });
            }
            try {
              const items = await scanAll();
              const body = build(items, days, Date.now());
              console.log(JSON.stringify({ days, scanned: items.length, returned: body.count, unparseable: body.unparseable }));
              return resp(200, body);
            } catch (err) {
              // Details stay in CloudWatch; the request ID locates them.
              console.error('Error:', err);
              return resp(500, { message: 'Error reading feeding logs.', requestId: context?.awsRequestId });
            }
          };

          const resp = (statusCode, obj) => ({
            statusCode,
            headers: {
              'Content-Type': 'application/json',
              'Cache-Control': 'no-store',
              'Access-Control-Allow-Origin': ALLOW_ORIGIN,
            },
            body: JSON.stringify(obj),
          });

          // Exposed for unit tests (cloud/lambda/test).
          exports._internals = { parseDays, windowStart, build };

  # --- Edge -----------------------------------------------------------------

  FeedingApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: luna-feeder-api-iac
      Description: Ingest endpoint for the Luna Feeder device
      EndpointConfiguration:
        Types:
          - REGIONAL

  FeedingLogsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref FeedingApi
      ParentId: !GetAtt FeedingApi.RootResourceId
      PathPart: feedingLogs

  # Proxy integration: the handler's statusCode, headers, and body map
  # directly to the HTTP response. IntegrationHttpMethod is always POST for
  # AWS_PROXY regardless of the client-facing method.
  FeedingLogsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref FeedingApi
      ResourceId: !Ref FeedingLogsResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IngestFunction.Arn}/invocations'

  # Resource policy on the function: only this API's POST /feedingLogs may
  # invoke it.
  IngestFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt IngestFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${FeedingApi}/*/POST/feedingLogs'

  # Dashboard read on the same resource: POST records a feeding, GET lists
  # them. Query string: days=7|30|90 (default 30), validated by the handler.
  FeedingLogsGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref FeedingApi
      ResourceId: !Ref FeedingLogsResource
      HttpMethod: GET
      AuthorizationType: NONE
      ApiKeyRequired: true
      RequestParameters:
        method.request.querystring.days: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ReadFunction.Arn}/invocations'

  # Only this API's GET /feedingLogs may invoke the read function.
  ReadFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ReadFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${FeedingApi}/*/GET/feedingLogs'

  # CORS preflight. A browser sends it before any cross-origin request that
  # carries x-api-key, and never attaches the key to the preflight itself, so
  # it cannot require one. MOCK: API Gateway answers directly; no Lambda runs.
  # Allows GET only, so browser pages cannot POST feedings.
  FeedingLogsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref FeedingApi
      ResourceId: !Ref FeedingLogsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      ApiKeyRequired: false
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: !Sub "'${CorsAllowOrigin}'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,x-api-key'"
              method.response.header.Access-Control-Max-Age: "'600'"
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: false
            method.response.header.Access-Control-Allow-Methods: false
            method.response.header.Access-Control-Allow-Headers: false
            method.response.header.Access-Control-Max-Age: false

  # Errors API Gateway raises itself (403 missing key, 429 throttled, 5xx
  # integration failures) never reach a Lambda, so they would lack the CORS
  # header and a browser would report "CORS error" instead of the real
  # status. These add it to every such response.
  Cors4xxGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref FeedingApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${CorsAllowOrigin}'"

  Cors5xxGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref FeedingApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${CorsAllowOrigin}'"

  # Deployments are immutable snapshots. To publish API changes, rename this
  # logical ID and update the stage's DeploymentId to match. DependsOn lists
  # everything the snapshot must include.
  FeedingApiDeployment20260929:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - FeedingLogsPostMethod
      - FeedingLogsGetMethod
      - FeedingLogsOptionsMethod
      - Cors4xxGatewayResponse
      - Cors5xxGatewayResponse
    Properties:
      RestApiId: !Ref FeedingApi
      Description: Adds GET /feedingLogs for the dashboard, with CORS

  FeedingApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref FeedingApi
      DeploymentId: !Ref FeedingApiDeployment20260929
      StageName: !Ref StageName

  # Value omitted so API Gateway generates it; keeps the credential out of
  # version control.
  FeedingApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: luna-feeder-device-key-iac
      Description: Device key for the Luna Feeder ESP32
      Enabled: true

  FeedingUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: luna-feeder-usage-plan-iac
      Description: Rate, burst, and quota ceiling for the feeder device
      ApiStages:
        - ApiId: !Ref FeedingApi
          Stage: !Ref FeedingApiStage
      Throttle:
        RateLimit: !Ref ThrottleRateLimit
        BurstLimit: !Ref ThrottleBurstLimit
      Quota:
        Limit: !Ref QuotaLimit
        Period: DAY

  FeedingUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref FeedingApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref FeedingUsagePlan

  # API keys are not scoped to methods: any key in a usage plan on this stage
  # can call every key-required method, so this key can also POST. The key
  # identifies and throttles the dashboard; it does not authorize it.
  DashboardApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: luna-feeder-dashboard-key-iac
      Description: Read key for the Luna Feeder dashboard
      Enabled: true

  DashboardUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: luna-feeder-dashboard-usage-plan-iac
      Description: Rate, burst, and quota ceiling for the dashboard
      ApiStages:
        - ApiId: !Ref FeedingApi
          Stage: !Ref FeedingApiStage
      Throttle:
        RateLimit: !Ref DashboardThrottleRateLimit
        BurstLimit: !Ref DashboardThrottleBurstLimit
      Quota:
        Limit: !Ref DashboardQuotaLimit
        Period: DAY

  DashboardUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref DashboardApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref DashboardUsagePlan

  # --- Notifications --------------------------------------------------------

  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: luna-feeder-notifications-iac
      # Shown as the sender name on emails.
      DisplayName: Luna Feeder

  # Each subscription requires a one-time confirmation click from its
  # address; stack status does not track confirmation. Logical ID kept from
  # the single-email revision so the existing confirmed subscription is not
  # replaced.
  NotificationEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref NotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail1

  EmailSubscription2:
    Type: AWS::SNS::Subscription
    Condition: HasEmail2
    Properties:
      TopicArn: !Ref NotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail2

  EmailSubscription3:
    Type: AWS::SNS::Subscription
    Condition: HasEmail3
    Properties:
      TopicArn: !Ref NotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail3

  EmailSubscription4:
    Type: AWS::SNS::Subscription
    Condition: HasEmail4
    Properties:
      TopicArn: !Ref NotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail4

  EmailSubscription5:
    Type: AWS::SNS::Subscription
    Condition: HasEmail5
    Properties:
      TopicArn: !Ref NotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail5

  NotifierFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/luna-feeder-notifier-iac
      RetentionInDays: 14

  # No RoleName: same account-global naming reason as the ingest role.
  NotifierFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadFeedingStream
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The stream ARN embeds a creation timestamp and is only
              # resolvable via GetAtt.
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                Resource: !GetAtt FeedingLogsTable.StreamArn
              # ListStreams cannot target a single stream; table-scoped
              # wildcard is the narrowest grant.
              - Effect: Allow
                Action: dynamodb:ListStreams
                Resource: !Sub '${FeedingLogsTable.Arn}/stream/*'
        - PolicyName: PublishNotifications
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref NotificationTopic
        - PolicyName: WriteOwnLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/luna-feeder-notifier-iac:*'

  # Inline code deploys as index.js and runs as CommonJS.
  # Source of truth: cloud/lambda/notifyDogFeeding.js. Edit there, copy here.
  NotifierFunction:
    Type: AWS::Lambda::Function
    DependsOn: NotifierFunctionLogGroup
    Properties:
      FunctionName: luna-feeder-notifier-iac
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt NotifierFunctionRole.Arn
      Timeout: 10
      Environment:
        Variables:
          TOPIC_ARN: !Ref NotificationTopic
          DISPLAY_TIMEZONE: America/Chicago
          BATTERY_WARN_VOLTS: !Ref BatteryWarnVolts
          BATTERY_CRIT_VOLTS: !Ref BatteryCritVolts
      Code:
        ZipFile: |
          // Notifier for the Luna Feeder: consumes the feeding table's
          // stream and publishes one message per new feeding.

          const { SNSClient, PublishCommand } = require('@aws-sdk/client-sns');
          const { unmarshall } = require('@aws-sdk/util-dynamodb');

          const sns = new SNSClient({});
          const TOPIC_ARN = process.env.TOPIC_ARN;
          const TZ = process.env.DISPLAY_TIMEZONE || 'America/Chicago';
          const WARN_V = Number(process.env.BATTERY_WARN_VOLTS);
          const CRIT_V = Number(process.env.BATTERY_CRIT_VOLTS);

          // Timestamps are stored in UTC; convert for display. The IANA zone
          // name keeps DST correct.
          const centralTime = (iso) => {
            const d = new Date(iso);
            if (!iso || Number.isNaN(d.getTime())) return iso || 'an unknown time';
            return d.toLocaleString('en-US', {
              timeZone: TZ,
              weekday: 'short', month: 'short', day: 'numeric',
              hour: 'numeric', minute: '2-digit', hour12: true,
              timeZoneName: 'short',
            });
          };

          // 1S li-ion holds a long plateau around 3.9-3.6 V with a knee near
          // 3.5 V. Voltage is a poor fuel gauge mid-plateau but a reliable
          // edge detector, so thresholds alert on the edges.
          const batteryStatus = (v) => {
            if (v == null || !Number.isFinite(v)) return { line: null, subjectTag: '' };
            const s = v.toFixed(2) + ' V';
            if (v <= CRIT_V) return {
              line: '\u{1FAAB} Battery critical: ' + s + ' - charge today. Below ~3.3 V a WiFi burst can brown out the board.',
              subjectTag: ' [battery critical]',
            };
            if (v <= WARN_V) return {
              line: '\u{1F50B} Battery low: ' + s + ' - worth charging in the next day or two.',
              subjectTag: ' [battery low]',
            };
            if (v >= 4.15) return { line: 'Battery: ' + s + ' (full or on charger)', subjectTag: '' };
            return { line: 'Battery: ' + s, subjectTag: '' };
          };

          exports.handler = async (event) => {
            for (const record of event.Records ?? []) {
              try {
                // New feedings only; MODIFY and REMOVE events are skipped.
                if (record.eventName !== 'INSERT') continue;

                // Stream records arrive as DynamoDB JSON.
                const item = unmarshall(record.dynamodb.NewImage);

                const name = item.person ?? 'Someone';
                const meal = item.meal ?? 'a meal';
                const when = centralTime(item.timestamp ?? item.receivedAt);
                const batt = batteryStatus(item.batteryVoltage);

                const lines = ['\u{1F415} Luna was fed ' + meal + ' by ' + name + ' at ' + when + '.'];
                if (item.override) lines.push('\u26A0\uFE0F Recency override was used for this feeding.');
                if (batt.line) lines.push(batt.line);

                await sns.send(new PublishCommand({
                  TopicArn: TOPIC_ARN,
                  // SNS Subject must be ASCII; emoji stay in the body.
                  Subject: 'Luna fed: ' + meal + ' by ' + name + batt.subjectTag,
                  Message: lines.join('\n'),
                }));
              } catch (err) {
                // Per-record handling: one bad record must not block the shard.
                console.error('Notify failed for record', record.eventID, err);
              }
            }
          };

  # Poll-based source: permissions live on the execution role, not on a
  # Lambda permission resource. LATEST avoids replaying retained records.
  NotifierEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt FeedingLogsTable.StreamArn
      FunctionName: !Ref NotifierFunction
      StartingPosition: LATEST

Outputs:

  InvokeUrl:
    Description: >-
      Full endpoint. The device POSTs here (update the firmware's secrets
      with this); the dashboard GETs it with ?days=7|30|90.
    Value: !Sub 'https://${FeedingApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/feedingLogs'

  ApiKeyId:
    Description: >-
      API key ID, not the key value. Retrieve the value at
      API Gateway -> API keys -> select this key -> Show.
    Value: !Ref FeedingApiKey

  DashboardApiKeyId:
    Description: >-
      Dashboard API key ID, not the key value. Retrieve the value at
      API Gateway -> API keys -> luna-feeder-dashboard-key-iac -> Show.
    Value: !Ref DashboardApiKey

  RestApiId:
    Description: REST API ID, the leading segment of the endpoint hostname
    Value: !Ref FeedingApi

  TableName:
    Description: Name of the feeding log table
    Value: !Ref FeedingLogsTable

  TableArn:
    Description: ARN of the feeding log table
    Value: !GetAtt FeedingLogsTable.Arn

  TableStreamArn:
    Description: Stream ARN, including its creation-timestamp suffix
    Value: !GetAtt FeedingLogsTable.StreamArn

  IngestFunctionArn:
    Description: ARN of the ingest Lambda
    Value: !GetAtt IngestFunction.Arn

  ReadFunctionArn:
    Description: ARN of the read Lambda
    Value: !GetAtt ReadFunction.Arn

  NotificationTopicArn:
    Description: SNS topic ARN
    Value: !Ref NotificationTopic